name: Deploy Blog

# 此 workflow 已简化：my-blog 项目配置了 GitHub 集成，
# 推送 blog/** 到 main 分支时由 Cloudflare 自动构建部署（继承环境变量）。

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git integration handles deployment
        run: |
          echo "Cloudflare Pages 已配置 GitHub 集成，推送后自动构建部署。"
