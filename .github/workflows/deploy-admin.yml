name: Deploy Admin

# 此 workflow 已禁用：blog-admin 项目配置了 GitHub 集成，
# 推送 admin/** 到 main 分支时由 Cloudflare 自动构建部署（继承环境变量）。
# 不再使用 Direct Upload，以确保运行时能读取环境变量。

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git integration handles deployment
        run: |
          echo "Cloudflare Pages 已配置 GitHub 集成，推送后自动构建（继承环境变量）。"
          echo "不再使用 Direct Upload，避免环境变量丢失。"
